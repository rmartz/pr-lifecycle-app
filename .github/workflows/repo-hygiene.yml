name: Repo Hygiene

# Consumes @rmartz/repo-hygiene through the rmartz/repo-hygiene-action composite
# action, SHA-pinned and bumped by Dependabot's github-actions ecosystem. The
# `checks` input is omitted on purpose: the action runs every default-on check,
# so a newly added check auto-joins on the next pin bump. Options live in
# .repo-hygiene.yml. The pre-commit hook (.husky/pre-commit) runs the same checks
# over staged content.
#
# The job id `hygiene` is the required status context; never rename it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write # post one `repo-hygiene / <check>` status per check
      actions: write # cancel the run, not fail it, when a check is inconclusive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rmartz/repo-hygiene-action@5ea64035e33737f85a9dc58a348f6d3c8a197bb3 # v6.0.1
        with:
          config: .repo-hygiene.yml
        env:
          GITHUB_TOKEN: ${{ github.token }} # for the checks that call the GitHub API
