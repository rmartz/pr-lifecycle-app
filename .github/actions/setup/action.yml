name: Setup
description: Install pnpm, Node.js, and project dependencies

inputs:
  frozen-lockfile:
    description: Use --frozen-lockfile for pnpm install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm version comes from packageManager in package.json
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    # Every dependency, @rmartz/* included, installs from npmjs with no token.
    - run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      shell: bash
