environments: [production]

# The gate project, pr-lifecycle-gate. Run envctl against it with
# `--deployment-dir deployment/gate` (see docs/development.md). The pin makes
# envctl refuse a .vercel link or VERCEL_PROJECT_ID naming another project.
deployments:
  - provider: vercel
    projectId: prj_kAQC6gawmmBbN1j1ag02pA2TqIGe
    teamId: team_kVIsLOZBHQLTMtnVSltoDb1g
    targets: { production: production }

services:
  # The gate App's secrets, managed by
  # `envctl secrets init|rotate github-app --private-key-file <pem>`.
  - provider: github-app
    environments: [production]
    webhookUrl: https://pr-lifecycle-gate.vercel.app/api/webhook
    variables:
      clientId: PR_GATE_CLIENT_ID
      privateKey: PR_GATE_PRIVATE_KEY
      webhookSecret: PR_GATE_WEBHOOK_SECRET
